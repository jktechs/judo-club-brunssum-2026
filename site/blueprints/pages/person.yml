title: Person Page


image:
  query: page.foto.toFile
columns:
  main:
    width: 2/3
    sections:
      text-fields:
        type: fields
        fields:
          name:
            label: Name
            type: text
            translate: false
          contact:
            label: Contact
            type: textarea
            size: small
            buttons: [link,email]
          role:
            label: Role
            type: checkboxes
            options:
              trainer:
                *: trainer
              board:
                *: board
              counselor:
                *: counselor
            translate: false
          bio:
            label: Bio
            type: textarea
            size: huge
  sidebar:
    width: 1/3
    sections:
      files:
        type: files
        create: false
        query: site.find('people').files
      file-fields:
        type: fields
        fields:
          foto:
            label: Image
            type: files
            uploads: false
            multiple: false
            layout: cards
            translate: false
            query: site.find('people').files
