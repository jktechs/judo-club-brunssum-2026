title: Trainer Page

columns:
  main:
    width: 2/3
    sections:
      text-fields:
        type: fields
        fields:
          name:
            label: Name
            type: text
          role:
            label: Role
            type: checkboxes
            options:
              trainer: Trainer
              board: Board-Member
              counselor: Trusted-Counselor
            translate: false
          bio:
            label: Bio
            type: textarea
            size: huge
  sidebar:
    width: 1/3
    sections:
      files:
        type: files
      file-fields:
        type: fields
        fields:
          image:
            label: Image
            type: files
            multiple: false
            layout: cards
            query: page.images
            translate: false
